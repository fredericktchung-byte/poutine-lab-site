<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred Chung | Senior Identity Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { opacity: 0; transition: opacity 0.8s ease-out; }
        .fade-in.visible { opacity: 1; }

</head>
<body class="bg-darkbg text-slate-300 antialiased min-h-screen flex flex-col">
    <main class="max-w-5xl mx-auto w-full p-6 flex-grow">
        <!-- Component Placeholders -->
        <div id="hero-container" class="fade-in"></div>
        <div id="case-studies-container" class="fade-in"></div>
        <div id="experience-container" class="fade-in"></div>
        <div id="certifications-container" class="fade-in"></div>
    </main>
  
    <script>
        // Certification Data & Logic (Moved from component to shell for script execution)
        const certs = [
            { title: "Okta Certified Consultant", issuer: "Okta", category: "Security", link: "https://www.credly.com/users/frederick-chung.9d693bd4", description: "Validated expertise in implementing enterprise-scale identity solutions." },
            { title: "Okta Certified Workflows - Specialist", issuer: "Okta", category: "Security", link: "https://www.credly.com/users/frederick-chung.9d693bd4", description: "Expertise in building complex, automated identity lifecycles." },
            { title: "CCZT & CCSK v.5 (CSA)", issuer: "CSA", category: "Security", link: "https://www.credly.com/users/frederick-chung.9d693bd4", description: "Cloud Security Alliance certifications for Zero Trust and Cloud Security." },
            { title: "AWS Certified Cloud Practitioner", issuer: "AWS", category: "Cloud", link: "https://skillsprofile.skillbuilder.aws/user/frederick-chung/certification-badges", description: "Foundational knowledge of AWS cloud infrastructure." },
            { title: "Microsoft Learn Profile", issuer: "Microsoft", category: "Cloud", link: "https://learn.microsoft.com/en-us/users/808hyena-2456/", description: "Active learning and skills in Microsoft ecosystem." },
            { title: "Google AI Skills (GEAR)", issuer: "Google", category: "AI", link: "https://www.skills.google/public_profiles/fc87e7db-3ead-42ac-b033-d1d0086b0bcb", description: "Skills in Generative AI and machine learning concepts." },
            { title: "Tines Builder: Expert & AI", issuer: "Tines", category: "AI", link: "https://www.credly.com/users/frederick-chung.9d693bd4", description: "Mastery of automated security orchestration and AI integration." }
        ];
 
        function renderCerts(filter = "all") {
            const grid = document.getElementById("cert-grid");
            if (!grid) return;
            grid.innerHTML = "";
            const filtered = filter === "all" ? certs : certs.filter(c => c.category === filter);
            
            filtered.forEach(cert => {
                const card = document.createElement("div");
                card.className = "bg-cardbg/30 p-4 rounded-lg border border-slate-800 hover:border-accent transition-all";
                card.innerHTML = `
                    <h4 class="text-lg font-bold text-accent mb-1">${cert.title}</h4>
                    <p class="text-xs text-slate-500 mb-3">${cert.issuer}</p>
                    <p class="text-sm text-slate-300 mb-4">${cert.description}</p>
                    <a href="${cert.link}" target="_blank" class="text-xs font-bold text-white hover:underline">Verify Credential $\rightarrow$</a>
                `;
                grid.appendChild(card);
            });
        }
 
        function filterCerts(cat) {
            renderCerts(cat);
        }
 
        async function loadComponent(containerId, filePaths) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            try {
                const promises = filePaths.map(async (path) => {
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`Failed to load ${path}`);
                    const html = await response.text();
                    container.insertAdjacentHTML('beforeend', html);
                });

                await Promise.all(promises);
                container.classList.add('visible');
            } catch (err) {
                console.error(`Error loading components for ${containerId}:`, err);
            }
        }
 
        document.addEventListener("DOMContentLoaded", () => {
            loadComponent("hero-container", ["components/hero.html"]);
            loadComponent("case-studies-container", ["components/case-studies-1.html", "components/case-studies-2.html"]);
            loadComponent("experience-container", ["components/experience.html"]);
            loadComponent("certifications-container", ["components/certifications.html"]);
            
            setTimeout(() => {
                renderCerts("all");
            }, 200);
        });
    </script>
 
    <!-- Header / Nav -->
    <nav class="max-w-5xl mx-auto w-full p-6 flex justify-between items-center border-b border-slate-800">
        <div class="text-xl font-bold text-white tracking-wide">poutine-lab<span class="text-accent">.com</span></div>
        <div class="space-x-4">
            <a href="#certifications" class="hover:text-accent transition-colors duration-200 text-sm font-semibold">Certifications</a>

        </div>
    </nav>
 
    <!-- Content Area (Stitched) -->
    <div id="main-content"></div>
    
    <footer class="text-center p-6 text-sm text-slate-500 mt-10 border-t border-slate-800">
        <div class="mb-4">
            <span class="font-bold text-white">&copy; 2026 Fred Chung | Camas, WA</span>
        </div>
        <div class="flex justify-center gap-6">
            <a href="https://www.linkedin.com/in/frederick-chung/" target="_blank" class="hover:text-accent">LinkedIn</a>
            <a href="https://github.com/fredericktchung-byte" target="_blank" class="hover:text-accent">GitHub</a>
            <a href="https://learn.microsoft.com/en-us/users/808hyena-2456/" target="_blank" class="hover:text-accent">Microsoft Learn</a>
            <a href="https://skillsprofile.skillbuilder.aws/user/frederick-chung/certification-badges" target="_blank" class="hover:text-accent">AWS Skills</a>
            <a href="https://www.skills.google/public_profiles/fc87e7db-3ead-42ac-b033-d1d0086b0bcb" target="_blank" class="hover:text-accent">Google Skills</a>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred Chung | Senior Identity Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { opacity: 0; transition: opacity 0.8s ease-out; }
        .fade-in.visible { opacity: 1; }
    </style>
</head>
<body class="bg-darkbg text-slate-300 antialiased min-h-screen flex flex-col">

    <!-- Header / Nav -->
    <nav class="max-w-5xl mx-auto w-full p-6 flex justify-between items-center border-b border-slate-800">
        <div class="text-xl font-bold text-white tracking-wide">poutine-lab<span class="text-accent">.com</span></div>
        <div class="space-x-4">
            <a href="#certifications" class="hover:text-accent transition-colors duration-200 text-sm font-semibold">Certifications</a>
            <a href="https://www.linkedin.com/in/frederick-chung/" target="_blank" rel="noopener noreferrer" class="hover:text-accent transition-colors duration-200 text-sm font-semibold">LinkedIn</a>
            <a href="https://github.com/fredericktchung-byte" target="_blank" rel="noopener noreferrer" class="hover:text-accent transition-colors duration-200 text-sm font-semibold">GitHub</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto w-full p-6 flex-grow">
        <!-- Component Placeholders -->
        <div id="hero-container" class="fade-in"></div>
        <div id="case-studies-container" class="fade-in"></div>
        <div id="experience-container" class="fade-in"></div>
        <div id="certifications-container" class="fade-in"></div>
    </main>

    <!-- Certification Detail Modal -->
    <div id="cert-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg border border-slate-700 max-w-md w-full rounded-xl p-6 shadow-2xl relative">
            <button onclick="closeCertModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            <span id="modal-issuer" class="text-xs font-mono text-slate-400"></span>
            <h3 id="modal-title" class="text-xl font-bold text-white mt-1 mb-3"></h3>
            <p id="modal-desc" class="text-sm text-slate-300 leading-relaxed mb-6"></p>
            <div class="flex justify-end gap-3">
                <button onclick="closeCertModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-white rounded-lg">Close</button>
                <a id="modal-verify" href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-accent hover:bg-sky-400 text-xs font-bold text-slate-900 rounded-lg">Verify Credential &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        // Core Platform Certifications Data
        const certs = [
            {
                title: "Okta Certified Consultant",
                issuer: "Okta",
                category: "Security",
                issued: "Jul 2026",
                link: "https://www.credly.com/users/frederick-chung.9d693bd4",
                description: "Validates technical proficiency in designing, implementing, and troubleshooting complex enterprise identity architectures, multi-tenant federation, and custom integration workflows."
            },
            {
                title: "Okta Certified Workflows - Specialist",
                issuer: "Okta",
                category: "Security",
                issued: "Oct 2024",
                link: "https://www.credly.com/users/frederick-chung.9d693bd4",
                description: "Demonstrates advanced mastery in constructing event-driven, complex automation lifecycles, API orchestrations, and error-handling pipelines via Okta Workflows."
            },
            {
                title: "CCZT & CCSK v.5 (CSA)",
                issuer: "Cloud Security Alliance",
                category: "Security",
                issued: "Aug 2026",
                link: "https://www.credly.com/users/frederick-chung.9d693bd4",
                description: "Comprehensively certifies architectural knowledge across Zero Trust principles, governance, data security, and cloud risk management frameworks."
            },
            {
                title: "Tines Builder: Expert & AI",
                issuer: "Tines",
                category: "AI",
                issued: "Aug 2026",
                link: "https://www.credly.com/users/frederick-chung.9d693bd4",
                description: "Certifies expert-level capability in automated security orchestration, cross-platform iPaaS integrations, and LLM-assisted workflow building."
            },
            {
                title: "AWS Certified Cloud Practitioner",
                issuer: "AWS",
                category: "Cloud",
                issued: "Aug 2021",
                link: "https://skillsprofile.skillbuilder.aws/user/frederick-chung/certification-badges",
                description: "Proves foundational knowledge of core AWS cloud services, networking security groups, IAM policies, and cloud infrastructure management."
            },
            {
                title: "Google AI & Generative AI Academy",
                issuer: "Google",
                category: "AI",
                issued: "2026",
                link: "https://www.skills.google/public_profiles/fc87e7db-3ead-42ac-b033-d1d0086b0bcb",
                description: "Rigorous technical training covering Generative AI fundamentals, large language model deployment, prompt engineering, and machine learning concepts."
            }
        ];

        // Specialized Micro-Credentials Array
        const microCredentials = [
            { title: "Secure Multi-Agent Workflows with Okta Agent to Agent", issuer: "Okta", year: "Sep 2026" },
            { title: "AWS Application Networking & Serverless Demonstrated", issuer: "AWS", year: "Sep 2026" },
            { title: "Analyze Identity Risk with ISPM", issuer: "Okta", year: "Sep 2026" },
            { title: "AWS Cloud Quest: Generative AI Practitioner", issuer: "AWS", year: "Sep 2026" },
            { title: "Build Agents in Copilot Studio", issuer: "Microsoft", year: "Aug 2026" },
            { title: "Extend Auth0 with Actions & Attack Protection", issuer: "Auth0", year: "Jul 2026" },
            { title: "Financial-Grade Identity & B2B Multi-Tenant Mgmt", issuer: "Auth0", year: "Jun 2026" },
            { title: "Securing AI Agents on Behalf of Users", issuer: "Auth0", year: "Jun 2026" },
            { title: "Configure DB Integration for Okta Privileged Access", issuer: "Okta", year: "Jun 2026" },
            { title: "Google Workspace Administrator", issuer: "Google Cloud", year: "Jun 2026" }
        ];

        function renderCerts(filter = "all") {
            const grid = document.getElementById("cert-grid");
            if (!grid) return;
            grid.innerHTML = "";

            const filtered = filter === "all" ? certs : certs.filter(c => c.category === filter);
            
            filtered.forEach((cert, idx) => {
                const card = document.createElement("div");
                card.className = "bg-cardbg/40 p-5 rounded-lg border border-slate-800 hover:border-accent transition-all flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs text-slate-500 font-mono">${cert.issuer} &bull; ${cert.issued}</span>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${cert.category}</span>
                        </div>
                        <h4 class="text-lg font-bold text-white mb-2">${cert.title}</h4>
                        <p class="text-sm text-slate-400 mb-4 line-clamp-3">${cert.description}</p>
                    </div>
                    <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                        <button onclick="openCertModal(${idx})" class="text-xs font-semibold text-accent hover:underline flex items-center gap-1">
                            View Details
                        </button>
                        <a href="${cert.link}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                            Verify &rarr;
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderMicroCerts();
        }

        function filterCerts(cat) {
            renderCerts(cat);
        }

        function renderMicroCerts() {
            const container = document.getElementById("micro-certs-grid");
            if (!container) return;
            container.innerHTML = "";

            microCredentials.forEach(mc => {
                const pill = document.createElement("div");
                pill.className = "bg-slate-900/60 border border-slate-800 px-3 py-2 rounded-lg text-xs flex justify-between items-center";
                pill.innerHTML = `
                    <span class="text-slate-200 font-medium">${mc.title}</span>
                    <span class="text-slate-500 text-[10px] ml-2 whitespace-nowrap">${mc.issuer}</span>
                `;
                container.appendChild(pill);
            });
        }

        function openCertModal(idx) {
            const cert = certs[idx];
            document.getElementById("modal-issuer").innerText = `${cert.issuer} • Issued ${cert.issued}`;
            document.getElementById("modal-title").innerText = cert.title;
            document.getElementById("modal-desc").innerText = cert.description;
            document.getElementById("modal-verify").href = cert.link;
            document.getElementById("cert-modal").classList.remove("hidden");
        }

        function closeCertModal() {
            document.getElementById("cert-modal").classList.add("hidden");
        }

        async function loadComponent(containerId, filePaths) {
            const container = document.getElementById(containerId);
            if (!container) return;
            try {
                const promises = filePaths.map(async (path) => {
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`Failed to load ${path}`);
                    const html = await response.text();
                    container.insertAdjacentHTML('beforeend', html);
                });
                await Promise.all(promises);
                container.classList.add('visible');
            } catch (err) {
                console.error(`Error loading components for ${containerId}:`, err);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadComponent("hero-container", ["components/hero.html"]);
            loadComponent("case-studies-container", ["components/case-studies-1.html", "components/case-studies-2.html"]);
            loadComponent("experience-container", ["components/experience.html"]);
            loadComponent("certifications-container", ["components/certifications.html"]);
            
            setTimeout(() => {
                renderCerts("all");
            }, 250);
        });
    </script>

    <footer class="text-center p-6 text-sm text-slate-500 mt-10 border-t border-slate-800">
        <div class="mb-4">
            <span class="font-bold text-white">&copy; 2026 Fred Chung | Camas, WA</span>
        </div>
        <div class="flex justify-center gap-6">
            <a href="https://www.linkedin.com/in/frederick-chung/" target="_blank" rel="noopener noreferrer" class="hover:text-accent">LinkedIn</a>
            <a href="https://github.com/fredericktchung-byte" target="_blank" rel="noopener noreferrer" class="hover:text-accent">GitHub</a>
            <a href="https://learn.microsoft.com/en-us/users/808hyena-2456/" target="_blank" rel="noopener noreferrer" class="hover:text-accent">Microsoft Learn</a>
            <a href="https://skillsprofile.skillbuilder.aws/user/frederick-chung/certification-badges" target="_blank" rel="noopener noreferrer" class="hover:text-accent">AWS Skills</a>
            <a href="https://www.skills.google/public_profiles/fc87e7db-3ead-42ac-b033-d1d0086b0bcb" target="_blank" rel="noopener noreferrer" class="hover:text-accent">Google Skills</a>
        </div>
    </footer>
</body>
</html>
